<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BORG</title>
<style>
:root{--borg:#33FF66;--bg:#000;--mono:'Courier New',monospace;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--borg);
font-family:var(--mono);overflow:hidden;user-select:none;}

.grid{position:fixed;inset:0;pointer-events:none;
background-image:linear-gradient(rgba(51,255,102,.09) 1px,transparent 1px),
linear-gradient(90deg,rgba(51,255,102,.09) 1px,transparent 1px);
background-size:36px 36px;animation:gridPulse 3s ease-in-out infinite;}
@keyframes gridPulse{0%,100%{opacity:.55;}50%{opacity:1;}}
.scanline{position:fixed;left:0;right:0;height:3px;
background:linear-gradient(90deg,transparent,var(--borg),transparent);
box-shadow:0 0 20px var(--borg);animation:scan 3s linear infinite;}
@keyframes scan{0%{top:0;}100%{top:100%;}}

.back-btn{position:absolute;top:16px;left:16px;z-index:10;
background:transparent;border:2px solid var(--borg);color:var(--borg);
font-family:inherit;font-weight:bold;font-size:12px;letter-spacing:2px;
padding:8px 16px;border-radius:16px;cursor:pointer;text-decoration:none;}

.wrap{position:relative;z-index:2;height:100vh;display:flex;
flex-direction:column;align-items:center;justify-content:center;
padding:20px;text-align:center;gap:14px;}

.title{font-size:clamp(22px,6vw,36px);letter-spacing:8px;font-weight:900;
color:var(--borg);text-shadow:0 0 30px var(--borg);}
.sub{font-size:clamp(9px,2vw,12px);letter-spacing:4px;opacity:.7;}

.core{position:relative;width:120px;height:200px;margin:10px 0;}
.tube{position:absolute;inset:0;width:60px;left:30px;margin:auto;
border-radius:30px;background:linear-gradient(180deg,#111,#0a2a12 50%,#111);
border:2px solid var(--borg);overflow:hidden;
box-shadow:inset 0 0 20px #000,0 0 30px rgba(51,255,102,.5);}
.plasma{position:absolute;inset:0;border-radius:28px;
background:repeating-linear-gradient(180deg,
rgba(51,255,102,0) 0px,rgba(51,255,102,.9) 4px,
rgba(180,255,200,1) 8px,rgba(51,255,102,.9) 12px,
rgba(51,255,102,0) 18px);
background-size:100% 240%;animation:flow .5s linear infinite;
filter:drop-shadow(0 0 18px var(--borg));}
@keyframes flow{0%{background-position:0 0;}100%{background-position:0 -200%;}}

.glow{position:absolute;top:50%;left:50%;width:200px;height:200px;
transform:translate(-50%,-50%);border-radius:50%;
background:radial-gradient(circle,rgba(51,255,102,.6),transparent 65%);
animation:glowPulse 1s ease-in-out infinite;pointer-events:none;}
@keyframes glowPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7;}
50%{transform:translate(-50%,-50%) scale(1.15);opacity:1;}}

.stats{display:flex;gap:24px;font-size:12px;letter-spacing:2px;}
.stats div{text-align:center;}
.stats b{display:block;font-size:20px;color:#c8ffd6;margin-top:4px;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="scanline"></div>
<a class="back-btn" href="index.html">← МЕНЮ</a>
<div class="wrap">
  <div class="title">WE ARE BORG</div>
  <div class="sub">RESISTANCE IS FUTILE · NODE 47 OF 8</div>
  <div class="core">
    <div class="glow"></div>
    <div class="tube"><div class="plasma"></div></div>
  </div>
  <div class="stats">
    <div>DRONES<b id="drones">0</b></div>
    <div>NODES<b>47</b></div>
    <div>ASSIMILATION<b id="pct">0%</b></div>
  </div>
</div>
<script>
var drones=0,pct=0;
var dEl=document.getElementById('drones');
var pEl=document.getElementById('pct');
setInterval(function(){
  drones += Math.floor(Math.random()*5)+1;
  pct = Math.min(100, pct + Math.random()*2);
  dEl.textContent = drones;
  pEl.textContent = Math.floor(pct)+'%';
}, 500);
</script>
</body>
</html>
