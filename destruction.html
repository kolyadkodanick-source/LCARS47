<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AUTO-DESTRUCT</title>
<style>
:root{--red:#FF3333;--mono:'Courier New',monospace;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0a0000;color:var(--red);
font-family:var(--mono);overflow:hidden;user-select:none;}

.grid{position:fixed;inset:0;pointer-events:none;
background:repeating-linear-gradient(0deg,rgba(255,51,51,.06) 0px,
rgba(255,51,51,.06) 2px,transparent 2px,transparent 6px);
animation:scan 4s linear infinite;}
@keyframes scan{0%{background-position:0 0;}100%{background-position:0 60px;}}
.bar{position:fixed;left:0;right:0;top:0;height:6px;
background:linear-gradient(90deg,transparent,var(--red),transparent);
box-shadow:0 0 20px var(--red);animation:barFlash .6s steps(2) infinite;}
@keyframes barFlash{0%,100%{opacity:1;}50%{opacity:.15;}}

.back-btn{position:absolute;top:16px;left:16px;z-index:10;
background:transparent;border:2px solid var(--red);color:var(--red);
font-family:inherit;font-weight:bold;font-size:12px;letter-spacing:2px;
padding:8px 16px;border-radius:16px;cursor:pointer;text-decoration:none;}

.wrap{position:relative;z-index:2;height:100vh;display:flex;
flex-direction:column;align-items:center;justify-content:center;
padding:20px;text-align:center;gap:14px;}

.title{font-size:clamp(24px,6vw,40px);letter-spacing:6px;font-weight:900;
color:var(--red);text-shadow:0 0 30px var(--red);animation:textFlash .8s steps(2) infinite;}
@keyframes textFlash{0%,100%{opacity:1;}50%{opacity:.5;}}

.countdown{font-size:clamp(80px,20vw,140px);font-weight:900;color:var(--red);
text-shadow:0 0 40px var(--red);font-variant-numeric:tabular-nums;
animation:countPulse 1s ease-in-out infinite;}
@keyframes countPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

.warning{font-size:clamp(11px,2.5vw,14px);letter-spacing:3px;opacity:.85;line-height:1.8;}

.code-entry{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center;}
.code-entry input{background:#1a0000;border:2px solid var(--red);color:#fff;
font-family:inherit;font-size:20px;letter-spacing:6px;text-align:center;
padding:12px 18px;border-radius:12px;width:120px;outline:none;}
.code-entry button{background:var(--red);border:none;color:#fff;font-family:inherit;
font-weight:bold;font-size:14px;letter-spacing:2px;padding:12px 24px;
border-radius:12px;cursor:pointer;text-transform:uppercase;}

.destroyed{position:fixed;inset:0;background:#000;z-index:100;
display:none;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:20px;}
.destroyed.active{display:flex;}
.destroyed h2{font-size:clamp(24px,6vw,40px);letter-spacing:6px;color:var(--red);
text-shadow:0 0 30px var(--red);margin-bottom:16px;}
.destroyed p{font-size:12px;letter-spacing:2px;color:var(--red);line-height:1.8;}
.destroyed button{margin-top:30px;padding:14px 28px;background:var(--red);
color:#fff;border:none;font-family:inherit;font-size:13px;font-weight:bold;
letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:12px;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="bar"></div>
<a class="back-btn" href="index.html">← МЕНЮ</a>
<div class="wrap">
  <div class="title">⚠ AUTO-DESTRUCT ⚠</div>
  <div class="countdown" id="countdown">10</div>
  <div class="warning">
    SELF-DESTRUCT SEQUENCE INITIATED<br>
    ВВЕДИ КОД <b>1</b> ДЛЯ ОТМЕНЫ
  </div>
  <div class="code-entry">
    <input type="text" id="codeInput" placeholder="КОД" maxlength="6" autocomplete="off">
    <button id="abortBtn">ОТМЕНА</button>
  </div>
</div>

<div class="destroyed" id="destroyed">
  <h2>💥 SHIP DESTROYED 💥</h2>
  <p>LCARS 47 · CONNECTION TERMINATED</p>
  <button id="restartBtn">ПЕРЕЗАПУСТИТЬ</button>
</div>

<script>
var seconds=10;
var countdownEl=document.getElementById('countdown');
var codeInput=document.getElementById('codeInput');
var timer=null;

function startCountdown(){
  seconds=10;
  countdownEl.textContent=seconds;
  if(timer) clearInterval(timer);
  timer=setInterval(function(){
    seconds--;
    countdownEl.textContent=seconds;
    if(seconds<=0){
      clearInterval(timer);
      document.getElementById('destroyed').classList.add('active');
    }
  },1000);
}

document.getElementById('abortBtn').addEventListener('click',function(){
  if(codeInput.value.trim()==='1'){
    clearInterval(timer);
    countdownEl.textContent='ОТМЕНЕНО';
    countdownEl.style.fontSize='40px';
  } else {
    codeInput.style.borderColor='#fff';
    setTimeout(function(){codeInput.style.borderColor='var(--red)';},300);
  }
});

document.getElementById('restartBtn').addEventListener('click',function(){
  document.getElementById('destroyed').classList.remove('active');
  countdownEl.style.fontSize='clamp(80px,20vw,140px)';
  codeInput.value='';
  startCountdown();
});

startCountdown();
</script>
</body>
</html>
